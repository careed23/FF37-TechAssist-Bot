[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ff37-techassist-bot"
version = "1.0.0"
description = "Interactive troubleshooting assistant for Forged Fiber 37 field technicians"
readme = "docs/README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Colten A. Reed"},
]
dependencies = [
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "flask>=3.0.2",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.6.0"]
dev = ["pyinstaller>=6.6.0"]

[project.scripts]
techassist-cli = "techassist.assistant:main"
techassist-gui = "techassist.desktop_app:main"
techassist-web = "techassist.web_app:main"

[tool.setuptools.packages.find]
where = ["src"]
