---
- name: Provision Calix G.Fast Subscriber
  hosts: calix_smx_devices
  gather_facts: no
  vars:
    subscriber_id: "{{ lookup('env', 'SUBSCRIBER_ID') }}"
    smx_username: "{{ lookup('env', 'SMX_USERNAME') }}"
    smx_password: "{{ lookup('env', 'SMX_PASSWORD') }}"
    smx_ip: "{{ lookup('env', 'SMX_IP') }}"
    vlan_id: "{{ lookup('env', 'VLAN_ID') }}"
    speed_profile: "{{ lookup('env', 'SPEED_PROFILE') }}" # e.g., '500M/100M'

  tasks:
    - name: Log in to Calix SMx
      ansible.builtin.shell:
        cmd: "ssh {{ smx_username }}@{{ smx_ip }} 'your_login_command_here'"
      register: smx_login_result
      ignore_errors: yes

    - name: Create Subscriber Service
      ansible.builtin.shell:
        cmd: "smx-cli -u {{ smx_username }} -p {{ smx_password }} 'create subscriber {{ subscriber_id }} vlan {{ vlan_id }} speed {{ speed_profile }}'"
      when: smx_login_result.rc == 0

    - name: Verify Subscriber Service Creation
      ansible.builtin.shell:
        cmd: "smx-cli -u {{ smx_username }} -p {{ smx_password }} 'show subscriber {{ subscriber_id }}'"
      register: subscriber_verification
      when: smx_login_result.rc == 0

    - name: Display Subscriber Verification
      ansible.builtin.debug:
        var: subscriber_verification.stdout_lines
      when: smx_login_result.rc == 0
