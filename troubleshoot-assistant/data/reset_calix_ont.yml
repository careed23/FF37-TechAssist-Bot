---
- name: Reset Calix ONT/SmartNID
  hosts: calix_devices
  gather_facts: no
  vars:
    ont_identifier: "{{ lookup('env', 'ONT_IDENTIFIER') }}" # Can be ONT ID or Serial Number
    smx_username: "{{ lookup('env', 'SMX_USERNAME') }}"
    smx_password: "{{ lookup('env', 'SMX_PASSWORD') }}"
    smx_ip: "{{ lookup('env', 'SMX_IP') }}"

  tasks:
    - name: Log in to Calix SMx or EMS
      ansible.builtin.shell:
        cmd: "ssh {{ smx_username }}@{{ smx_ip }} 'your_login_command_here'"
      register: smx_login_result
      ignore_errors: yes

    - name: Reset ONT/SmartNID to Factory Defaults
      # The exact command will depend on the specific Calix EMS (e.g., SMx, CMS)
      ansible.builtin.shell:
        cmd: "smx-cli -u {{ smx_username }} -p {{ smx_password }} 'reset ont {{ ont_identifier }} factory'"
      when: smx_login_result.rc == 0

    - name: Verify Reset Status
      ansible.builtin.shell:
        cmd: "smx-cli -u {{ smx_username }} -p {{ smx_password }} 'show ont {{ ont_identifier }} status'"
      register: reset_status
      when: smx_login_result.rc == 0

    - name: Display Reset Status
      ansible.builtin.debug:
        var: reset_status.stdout_lines
      when: smx_login_result.rc == 0
