---
- name: Provision Adtran TA5000 Series GPON ONT
  hosts: network_devices
  gather_facts: no
  vars:
    ont_serial_number: "{{ lookup('env', 'ONT_SERIAL_NUMBER') }}"
    ont_type: "{{ lookup('env', 'ONT_TYPE') }}"
    olt_ip: "{{ lookup('env', 'OLT_IP') }}"
    admin_username: "{{ lookup('env', 'ADMIN_USERNAME') }}"
    admin_password: "{{ lookup('env', 'ADMIN_PASSWORD') }}"

  tasks:
    - name: Access Adtran TA5000 Series device via CLI
      ansible.builtin.shell:
        cmd: ssh {{ admin_username }}@{{ olt_ip }} "your_login_command_here"
      register: ssh_result
      ignore_errors: yes # Handle potential login failures gracefully

    - name: Check if ONT is already discovered
      ansible.builtin.shell:
        cmd: "show ont info {{ ont_serial_number }}"
      register: ont_discovery_status
      when: ssh_result.rc == 0

    - name: Create New ONT if not discovered
      ansible.builtin.shell:
        cmd: "ont add {{ ont_serial_number }} {{ ont_type }}"
      when: "'No ONT found' in ont_discovery_status.stdout or ont_discovery_status.rc != 0"

    - name: Activate ONT
      ansible.builtin.shell:
        cmd: "ont activate {{ ont_serial_number }}"
      when: ssh_result.rc == 0

    - name: Base ONT Provisioning
      ansible.builtin.shell:
        cmd: "ont provision base {{ ont_serial_number }}"
      when: ssh_result.rc == 0

    - name: Provision ONT Ethernet Port
      ansible.builtin.shell:
        cmd: "ont provision ethernet {{ ont_serial_number }} eth1"
      when: ssh_result.rc == 0

    - name: Create Interface Map
      ansible.builtin.shell:
        cmd: "create interface-map ont {{ ont_serial_number }} map-name MyMap vlan 100"
      when: ssh_result.rc == 0

    - name: Create Downstream Shaper
      ansible.builtin.shell:
        cmd: "create shaper downstream ont {{ ont_serial_number }} rate 1000000"
      when: ssh_result.rc == 0

    - name: Create Upstream Shaper
      ansible.builtin.shell:
        cmd: "create shaper upstream ont {{ ont_serial_number }} rate 1000000"
      when: ssh_result.rc == 0

    - name: Identify Interface Map (example for verification)
      ansible.builtin.shell:
        cmd: "show interface-map ont {{ ont_serial_number }}"
      register: interface_map_verification
      when: ssh_result.rc == 0

    - name: Display Interface Map Verification
      ansible.builtin.debug:
        var: interface_map_verification.stdout_lines
      when: ssh_result.rc == 0
