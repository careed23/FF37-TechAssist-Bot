---
- name: Provision Positron G.HN Service
  hosts: positron_gam_devices
  gather_facts: no
  vars:
    subscriber_id: "{{ lookup('env', 'SUBSCRIBER_ID') }}"
    gam_username: "{{ lookup('env', 'GAM_USERNAME') }}"
    gam_password: "{{ lookup('env', 'GAM_PASSWORD') }}"
    gam_ip: "{{ lookup('env', 'GAM_IP') }}"
    vlan_id: "{{ lookup('env', 'VLAN_ID') }}"
    speed_profile: "{{ lookup('env', 'SPEED_PROFILE') }}"

  tasks:
    - name: Log in to Positron GAM device
      ansible.builtin.shell:
        cmd: "ssh {{ gam_username }}@{{ gam_ip }} 'your_login_command_here'"
      register: gam_login_result
      ignore_errors: yes

    - name: Create Subscriber Service
      ansible.builtin.shell:
        cmd: "gam-cli -u {{ gam_username }} -p {{ gam_password }} 'create service {{ subscriber_id }} vlan {{ vlan_id }} speed {{ speed_profile }}'"
      when: gam_login_result.rc == 0

    - name: Verify Subscriber Service Creation
      ansible.builtin.shell:
        cmd: "gam-cli -u {{ gam_username }} -p {{ gam_password }} 'show service {{ subscriber_id }}'"
      register: service_verification
      when: gam_login_result.rc == 0

    - name: Display Service Verification
      ansible.builtin.debug:
        var: service_verification.stdout_lines
      when: gam_login_result.rc == 0
