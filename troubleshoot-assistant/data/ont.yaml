# =============================================================
# FF37 TechAssist Bot - Master Workflow File
# Quantum Fiber Facility Management Workflows
# Encoding: UTF-8
# =============================================================
# WORKFLOWS INCLUDED:
#   1. WF-QF-ONT-001  - Change ONT Port on Pending Order
#   2. WF-QF-SIZE-001 - Change ONT Size in ODiN
#   3. WF-QF-SPLIT-001 - Change Splitter Leg
# =============================================================

flows:

  # =============================================================
  # WORKFLOW 1: CHANGE ONT PORT ON PENDING ORDER
  # Source: SL-MP-2023-05-001 Issue 4 (08/23/2024)
  # =============================================================

  - id: "WF-QF-ONT-001"
    name: "Change ONT Port on Pending Order"
    description: "Change ONT physical port assignment on a pending Quantum Fiber service order using Optius and ODiN"
    category: "Quantum Fiber - Facility Management"
    version: "4.0"
    source_document: "SL-MP-2023-05-001 Issue 4"

    steps:

      - id: "OPC-S001"
        question: "Which method would you like to use to change the ONT port?"
        options:
          - value: "fdt"
            description: "Field Data Tool (FDT) - automated and faster"
            next: "OPC-S002"
          - value: "manual"
            description: "Manual process using Optius and ODiN"
            next: "OPC-S010"

      - id: "OPC-S002"
        question: "Does the ONT have multiple ports AND is the current port status PENDING?"
        options:
          - value: "yes"
            description: "Yes - multi-port ONT with PENDING status"
            next: "OPC-S003"
          - value: "no"
            description: "No - single port ONT or port is not PENDING"
            next: "OPC-S010"

      - id: "OPC-S003"
        question: "Are you ready to proceed with the Field Data Tool?"
        options:
          - value: "yes"
            description: "Yes - I have the FDT document open"
            solution: "SOL-OPC-FDT"
          - value: "no"
            description: "No - I need to locate the FDT document first"
            solution: "SOL-OPC-FDT-REF"

      - id: "OPC-S010"
        question: "Do you have the pending service order open in Optius? (Service Order > Service Order Inquiry/Update)"
        options:
          - value: "yes"
            description: "Yes - order is open in Optius"
            next: "OPC-S011"
          - value: "no"
            description: "No - I need help finding the order"
            solution: "SOL-OPC-FINDORDER"

      - id: "OPC-S011"
        question: "Have you retrieved the ONT Distinguished Name and current PP= port from the CED Info section?"
        options:
          - value: "yes"
            description: "Yes - I have the ONT name and port number noted"
            next: "OPC-S012"
          - value: "no"
            description: "No - I need help finding CED Info"
            solution: "SOL-OPC-CEDINFO"

      - id: "OPC-S012"
        question: "In ODiN, what is the status of your TARGET port (the port you want to move TO)?"
        options:
          - value: "available"
            description: "Available - green checkmark icon"
            next: "OPC-S013"
          - value: "pending"
            description: "Pending - blue dot icon"
            next: "OPC-S020"
          - value: "working"
            description: "Working - lightning bolt icon"
            next: "OPC-S030"
          - value: "suspended"
            description: "Suspended - pause symbol icon"
            next: "OPC-S040"

      - id: "OPC-S013"
        question: "In ODiN on the target port's Hardware - Physical Port page, does Associated Locations show any address?"
        options:
          - value: "no_address"
            description: "No - port is clean with no address associated"
            next: "OPC-S014"
          - value: "has_address"
            description: "Yes - there is an address tied to this port"
            solution: "SOL-OPC-REMOVELEFTIN"

      - id: "OPC-S014"
        question: "Have you pasted the ONT Distinguished Name into the CED Distinguished Name field in Optius and clicked Re-assign ODiN Facilities?"
        options:
          - value: "success"
            description: "Yes - received success message 30058"
            next: "OPC-S015"
          - value: "error"
            description: "Yes - received an error message"
            solution: "SOL-OPC-REASSIGNERR"
          - value: "need_help"
            description: "No - I need help with this step"
            solution: "SOL-OPC-REASSIGN"

      - id: "OPC-S015"
        question: "Have you updated the Virtual ID? (Dropdown > Update BroadBand Path > Go > Update TA Path > Auto Assign TA Path)"
        options:
          - value: "success"
            description: "Yes - received success message 3655"
            next: "OPC-S016"
          - value: "error_3981"
            description: "Yes - received error 3981 Virtual ID cannot be working"
            solution: "SOL-OPC-ERR3981"
          - value: "need_help"
            description: "No - I need help updating the Virtual ID"
            solution: "SOL-OPC-VIRTUALID"

      - id: "OPC-S016"
        question: "Have you clicked Back twice and saved the service order?"
        options:
          - value: "success"
            description: "Yes - received success message 1218 Service Order has been updated"
            solution: "SOL-OPC-COMPLETE"
          - value: "error"
            description: "Yes - received an error when saving"
            solution: "SOL-OPC-SAVEERR"
          - value: "need_help"
            description: "No - I need help saving the order"
            solution: "SOL-OPC-SAVE"

      - id: "OPC-S020"
        question: "The target port is PENDING. Have you investigated what order is using this port in ODiN?"
        options:
          - value: "yes_duplicate"
            description: "Yes - confirmed it is a duplicate order on same address"
            solution: "SOL-OPC-CANCELDUP"
          - value: "yes_legit"
            description: "Yes - appears to be a legitimate order on a different address"
            solution: "SOL-OPC-PENDINGESC"
          - value: "no"
            description: "No - I need help investigating the pending port"
            solution: "SOL-OPC-INVESTPEND"

      - id: "OPC-S030"
        question: "The target port is WORKING. Has a supervisor confirmed the service was signed off in error?"
        options:
          - value: "yes"
            description: "Yes - supervisor has confirmed and approved disconnect"
            solution: "SOL-OPC-DISCWORKING"
          - value: "no"
            description: "No - not confirmed yet"
            solution: "SOL-OPC-WORKINGESC"

      - id: "OPC-S040"
        question: "The target port is SUSPENDED. Are you ready to change it to Available status in ODiN?"
        options:
          - value: "yes"
            description: "Yes - ready to unsuspend the port"
            solution: "SOL-OPC-UNSUSPEND"
          - value: "no"
            description: "No - I need more information first"
            solution: "SOL-OPC-SUSPENDINFO"

  # =============================================================
  # WORKFLOW 2: CHANGE ONT SIZE IN ODIN
  # Source: QF Tech Assist - Change ONT Size in ODiN
  # =============================================================

  - id: "WF-QF-SIZE-001"
    name: "Change ONT Size in ODiN"
    description: "Update the ONT specification and size in ODiN when a physical ONT has been replaced with a different model or the inventory record is incorrect"
    category: "Quantum Fiber - Facility Management"
    version: "1.0"
    source_document: "QF Tech Assist - Change ONT Size in ODiN"

    steps:

      - id: "OSC-S001"
        question: "What is the reason the ONT size needs to be changed in ODiN?"
        options:
          - value: "replaced"
            description: "ONT was physically replaced in the field with a different model"
            next: "OSC-S002"
          - value: "inventory_error"
            description: "ONT size in ODiN is incorrect - inventory record error"
            next: "OSC-S002"
          - value: "upgrade"
            description: "Customer ONT was upgraded to a larger or different model"
            next: "OSC-S002"
          - value: "unsure"
            description: "Not sure why it needs to change"
            solution: "SOL-OSC-VERIFYREASON"

      - id: "OSC-S002"
        question: "Do you have the ONT Distinguished Name? (Available from Optius CED Info or ODiN address search)"
        options:
          - value: "yes"
            description: "Yes - I have the ONT Distinguished Name"
            next: "OSC-S003"
          - value: "no"
            description: "No - I need to find it"
            solution: "SOL-OSC-FINDDN"

      - id: "OSC-S003"
        question: "Have you located the ONT in ODiN on the Physical Device - Optical Node Terminal page?"
        options:
          - value: "yes"
            description: "Yes - I can see the ONT details page in ODiN"
            next: "OSC-S004"
          - value: "no"
            description: "No - I cannot find the ONT in ODiN"
            solution: "SOL-OSC-SEARCHODIN"

      - id: "OSC-S004"
        question: "Does the ONT currently have any WORKING ports (active customer services on this ONT)?"
        options:
          - value: "no_working"
            description: "No working ports - ONT is available or only has pending ports"
            next: "OSC-S005"
          - value: "has_working"
            description: "Yes - there are active working ports on this ONT"
            solution: "SOL-OSC-WORKINGWARN"

      - id: "OSC-S005"
        question: "Do you have the correct new ONT specification for the replacement model?"
        options:
          - value: "yes"
            description: "Yes - I have the correct spec (e.g., PRSPEC=ONT-4-2-W or similar)"
            next: "OSC-S006"
          - value: "no"
            description: "No - I need to find the correct specification"
            solution: "SOL-OSC-FINDSPEC"

      - id: "OSC-S006"
        question: "Have you navigated to the Specification field on the ONT page in ODiN and opened it for editing?"
        options:
          - value: "yes"
            description: "Yes - I have the specification edit screen open"
            next: "OSC-S007"
          - value: "no"
            description: "No - I need help navigating to the spec field"
            solution: "SOL-OSC-NAVSPEC"

      - id: "OSC-S007"
        question: "Have you selected the correct new ONT specification and saved the change?"
        options:
          - value: "success"
            description: "Yes - specification updated and saved successfully"
            next: "OSC-S008"
          - value: "error"
            description: "Yes - received an error when updating"
            solution: "SOL-OSC-SPECERR"
          - value: "need_help"
            description: "No - I need help selecting and saving the spec"
            solution: "SOL-OSC-UPDATESPEC"

      - id: "OSC-S008"
        question: "After the spec change, does the Containment Structure in ODiN show the correct number of ports for the new ONT model?"
        options:
          - value: "yes_matches"
            description: "Yes - port count matches the new ONT specification"
            next: "OSC-S009"
          - value: "no_mismatch"
            description: "No - port count does not match the new model"
            solution: "SOL-OSC-PORTMISMATCH"
          - value: "unsure"
            description: "Not sure how to verify the port count"
            solution: "SOL-OSC-VERIFYPORTS"

      - id: "OSC-S009"
        question: "Is there an active pending service order in Optius that needs to be updated to reflect the new ONT?"
        options:
          - value: "yes"
            description: "Yes - there is a pending order that needs updating"
            solution: "SOL-OSC-UPDATEORDER"
          - value: "no"
            description: "No - this is an inventory-only correction with no active orders"
            solution: "SOL-OSC-COMPLETE"

  # =============================================================
  # WORKFLOW 3: CHANGE SPLITTER LEG
  # Source: SL-MP-2024-01-001 Issue 3 (06/20/2025)
  # =============================================================

  - id: "WF-QF-SPLIT-001"
    name: "Change Splitter Leg"
    description: "Change the Splitter Leg associated with a fiber distribution strand for pending or working Quantum Fiber customers"
    category: "Quantum Fiber - Facility Management"
    version: "3.0"
    source_document: "SL-MP-2024-01-001 Issue 3"

    steps:

      - id: "SLC-S001"
        question: "Can you use the Field Data Tool (FDT) to change the Splitter Leg?"
        options:
          - value: "yes"
            description: "Yes - FDT is available and applicable for this scenario"
            solution: "SOL-SLC-FDT"
          - value: "no"
            description: "No - FDT cannot be used, manual process required"
            next: "SLC-S002"

      - id: "SLC-S002"
        question: "What is the technology type? (Check Network Resource Role - NRR in ODiN on the splitter)"
        options:
          - value: "static"
            description: "Static build - XGS, G.hn, G.Fast, Distributed Split, or Bulk Instant Internet"
            next: "SLC-S003"
          - value: "dynamic"
            description: "Dynamic build - standard GPON or flexible architecture"
            next: "SLC-S004"
          - value: "unsure"
            description: "Not sure how to determine the technology type"
            solution: "SOL-SLC-CHECKTECH"

      - id: "SLC-S003"
        question: "Static build confirmed. Have you created the required Engineering case BEFORE making any facility changes?"
        options:
          - value: "yes"
            description: "Yes - Engineering case created with all required information"
            next: "SLC-S004"
          - value: "no"
            description: "No - I need to create the Engineering case first"
            solution: "SOL-SLC-ENGCASE"

      - id: "SLC-S004"
        question: "What is the current order status for this customer address?"
        options:
          - value: "pending"
            description: "Pending order exists in Optius"
            next: "SLC-S005"
          - value: "working"
            description: "Service is currently working and active"
            next: "SLC-S006"
          - value: "no_order"
            description: "No active order or reservation (ORSV not present in ODiN)"
            next: "SLC-S007"

      - id: "SLC-S005"
        question: "Have you captured ALL current facility information from ODiN before canceling? (FDH name, PP number, current leg Distinguished Name)"
        options:
          - value: "yes"
            description: "Yes - all facility info documented"
            solution: "SOL-SLC-CANCELPEND"
          - value: "no"
            description: "No - I need to capture facilities first"
            solution: "SOL-SLC-CAPTUREFAC"

      - id: "SLC-S006"
        question: "Have you verified the reason the original leg cannot be used with the field technician?"
        options:
          - value: "defective"
            description: "Leg is defective - bad splice, fiber damage, or signal loss"
            solution: "SOL-SLC-CIDIS"
          - value: "wrong_leg"
            description: "PP is physically connected to the wrong leg in the field"
            solution: "SOL-SLC-CIDIS"
          - value: "not_verified"
            description: "Have not verified with the technician yet"
            solution: "SOL-SLC-VERIFYTECH"

      - id: "SLC-S007"
        question: "Have you removed the FSAN serial number from the Network Management System (NMS)?"
        options:
          - value: "yes"
            description: "Yes - FSAN serial number removed from NMS"
            next: "SLC-S008"
          - value: "no"
            description: "No - need to remove FSAN first"
            solution: "SOL-SLC-REMOVEFSAN"

      - id: "SLC-S008"
        question: "Is the Physical Port (PP) still associated to the old leg in ODiN? (Check for + sign in front of Distribution Network)"
        options:
          - value: "yes_associated"
            description: "Yes - PP is still tied to the old leg"
            solution: "SOL-SLC-DISASSOC"
          - value: "no_free"
            description: "No - PP is already disassociated and free"
            next: "SLC-S009"

      - id: "SLC-S009"
        question: "Was the original splitter leg defective and should it be prevented from future use?"
        options:
          - value: "yes_defective"
            description: "Yes - leg is defective and needs to be suspended"
            next: "SLC-S010"
          - value: "no_not_defective"
            description: "No - leg is fine, just needed a different assignment"
            next: "SLC-S011"

      - id: "SLC-S010"
        question: "Have you suspended the defective leg in ODiN with proper documentation? (Date, reason, tech CUID, agent CUID)"
        options:
          - value: "yes"
            description: "Yes - leg suspended with full documentation in Description field"
            next: "SLC-S011"
          - value: "no"
            description: "No - I need to suspend the leg first"
            solution: "SOL-SLC-SUSPENDLEG"

      - id: "SLC-S011"
        question: "Have you associated the PP to the new correct splitter leg in ODiN?"
        options:
          - value: "yes"
            description: "Yes - PP successfully associated to new leg"
            next: "SLC-S012"
          - value: "no"
            description: "No - I need help associating the PP to the new leg"
            solution: "SOL-SLC-ASSOCPP"

      - id: "SLC-S012"
        question: "Have you recreated the order and verified the new facilities are correct on the Work Order in QFSF?"
        options:
          - value: "yes_verified"
            description: "Yes - order recreated and QFSF work order shows the correct new leg"
            solution: "SOL-SLC-COMPLETE"
          - value: "created_not_verified"
            description: "Order was recreated but QFSF work order not yet verified"
            solution: "SOL-SLC-VERIFYQFSF"
          - value: "no"
            description: "No - I need help recreating the order"
            solution: "SOL-SLC-RECREATE"

# =============================================================
# SOLUTIONS
# =============================================================

solutions:

  # -----------------------------------------------------------
  # WORKFLOW 1 SOLUTIONS - ONT PORT CHANGE
  # -----------------------------------------------------------

  - id: "SOL-OPC-FDT"
    title: "Use Field Data Tool (FDT) to Change ONT Port"
    steps:
      - "Open the Field Data Tool Kit document from the NAO Library SharePoint"
      - "Navigate to the section for changing the port on a multi-port ONT"
      - "Ensure ONT has multiple ports and target port status is PENDING"
      - "Follow FDT steps to perform the port change"
      - "FDT will automatically update both Optius and ODiN"
      - "FDT will send order through Open Switchgate (OSG) if already submitted"
      - "Verify port change completed - no further manual steps required"
    reference_doc: "Quantum Fiber - Field Data Tool Kit (QF Tech Assist)"
    escalate_if: "FDT returns Not Found message - fall back to manual process"

  - id: "SOL-OPC-FDT-REF"
    title: "Locate the Field Data Tool Kit Document"
    steps:
      - "Navigate to: https://centurylink.sharepoint.com/sites/NAOLibrary"
      - "Search for: Quantum Fiber - Field Data Tool Kit (QF Tech Assist)"
      - "Open the document and go to the ONT port change section"
      - "Return to the FDT workflow once the document is open and reviewed"
    reference_doc: "https://centurylink.sharepoint.com/sites/NAOLibrary"
    escalate_if: "Cannot access SharePoint - contact supervisor for document access"

  - id: "SOL-OPC-FINDORDER"
    title: "Find Pending Service Order in Optius"
    steps:
      - "In Optius, click the Service Order tab at the top of the page"
      - "Select Service Order Inquiry / Update"
      - "Under Specific Order Information enter the SO Number in the SO Number field"
      - "Click the Find button"
      - "Select the radio button beside your order in the results list"
      - "Click Open Details button"
      - "Order Inward Details page will open - proceed to retrieve CED Info"
    escalate_if: "Order not found or shows unexpected status - verify SO number with customer record"

  - id: "SOL-OPC-CEDINFO"
    title: "Retrieve ONT Information from CED Info in Optius"
    steps:
      - "On Service Order Inquiry/Update Inward Details page scroll to the very bottom"
      - "Locate the ODiN facilities section for the assigned address"
      - "Click the CED Info dropdown to expand it"
      - "Wait for ONT information to populate in the section"
      - "In the ODiN Resource column find the ONT Distinguished Name"
      - "Example format: ME=1858 CHARLESTON LN ONT 1"
      - "Also note the current port at the end of the string - look for PP=XXX"
      - "Example: PP=002 means the current assignment is Port 2"
      - "Copy and save the ONT Distinguished Name - you will need it for ODiN and reassignment"
    escalate_if: "CED Info is empty or no ONT data shows - verify order has fiber facilities assigned"

  - id: "SOL-OPC-REASSIGN"
    title: "Re-assign ODiN Facilities in Optius"
    steps:
      - "Return to the Service Order Inquiry/Update Inward Details page"
      - "Scroll to the bottom where ODiN facilities are displayed"
      - "Locate the three fields just above CED Info: CED Distinguished Name, Reuse Network, Splitter Leg DN"
      - "Click in the CED Distinguished Name field"
      - "Paste ONLY the ONT name portion - example: ME=1858 CHARLESTON LN ONT 1"
      - "Do NOT include SL= or PP= values in this field - ONT name only"
      - "Click the Re-assign ODiN Facilities button on the far right side of the page"
      - "Wait 5 to 10 seconds for system processing"
      - "Look for success message at top: 30058 - Fiber Facilities have been assigned"
      - "Expand CED Info and verify the PP= value changed to your target port"
    escalate_if: "No success message after 3 attempts with correct ONT name - escalate to supervisor"

  - id: "SOL-OPC-REASSIGNERR"
    title: "Troubleshoot Re-assign ODiN Facilities Error"
    steps:
      - "Verify CED Distinguished Name field contains ONLY the ONT name"
      - "Correct: ME=1858 CHARLESTON LN ONT 1"
      - "Wrong: ME=1858 CHARLESTON LN ONT 1/SL=002/NC=001/PP=002 (do not include slash and port info)"
      - "Copy the ONT Distinguished Name fresh from CED Info and try again"
      - "Trim any leading or trailing spaces from the pasted name"
      - "Verify target port shows Available in ODiN before attempting reassignment"
      - "Try a different browser if issue continues"
    escalate_if: "Error persists after 3 correct attempts - escalate to supervisor with screenshot"

  - id: "SOL-OPC-VIRTUALID"
    title: "Update Virtual ID (CVLAN/CTAG) After Port Change"
    steps:
      - "After receiving success message 30058 stay on the order details page"
      - "Scroll to the bottom of the Service Order Inward Details page"
      - "Find the dropdown menu in the Additional Information section"
      - "Select Update BroadBand Path from the dropdown"
      - "Click the Go button"
      - "On Virtual Alignment/Transport Access Path page click Update TA Path"
      - "On Update Transport Access Path page click Auto Assign TA Path"
      - "Wait for success message: 3655 - Transport Access Path has been assigned"
      - "New CVLAN and CTAG values will populate automatically in the fields"
      - "Click Back link at top of page once"
      - "Click Back link at top of page a second time to return to Service Order Inward Details"
    escalate_if: "Auto Assign TA Path fails repeatedly - VLAN pool may be exhausted, escalate to provisioning team"

  - id: "SOL-OPC-ERR3981"
    title: "Fix Error 3981 - Virtual ID Cannot Be Working/Pending/Test"
    steps:
      - "Error 3981 means you attempted to Save before completing the Virtual ID update"
      - "Do NOT click Save again yet"
      - "Scroll to the bottom of the order page"
      - "From the dropdown select Update BroadBand Path and click Go"
      - "On Virtual Alignment/Transport Access Path page click Update TA Path"
      - "On Update Transport Access Path page click Auto Assign TA Path"
      - "Wait for success message: 3655 - Transport Access Path has been assigned"
      - "Click Back twice to return to Service Order Inward Details"
      - "NOW click Save - you should receive message 1218"
    escalate_if: "Error 3981 continues even after completing Virtual ID update - escalate to supervisor"

  - id: "SOL-OPC-SAVE"
    title: "Save Service Order After Port Change"
    steps:
      - "Confirm you have received message 3655 for Virtual ID update before saving"
      - "Click Back twice to return to the Service Order Inquiry/Update Inward Details page"
      - "Scroll to the bottom of the page"
      - "Click the Save button"
      - "Wait for success message: 1218 - Service Order has been updated"
      - "Expand CED Info one final time to verify the new PP= value is correct"
    escalate_if: "Save fails with any error - screenshot the error and escalate to supervisor"

  - id: "SOL-OPC-SAVEERR"
    title: "Troubleshoot Service Order Save Error"
    steps:
      - "If error code is 3981 - see the Error 3981 solution, Virtual ID update is required first"
      - "If a different error - screenshot the complete error message and code"
      - "Verify your Optius session has not timed out"
      - "Check if another agent has the same order open simultaneously"
      - "Try refreshing the page and re-opening the order from Service Order Inquiry"
    escalate_if: "Any save error other than 3981 - escalate immediately with error screenshot"

  - id: "SOL-OPC-COMPLETE"
    title: "ONT Port Change Complete - Final Verification Checklist"
    steps:
      - "OPTIUS CHECK: CED Info shows new port - PP= value has changed to target port"
      - "OPTIUS CHECK: Success message 1218 was received when saving"
      - "OPTIUS CHECK: New CVLAN and CTAG assigned (message 3655 was received)"
      - "ODIN CHECK: Target port now shows PENDING status (blue dot)"
      - "ODIN CHECK: Previous port returned to AVAILABLE status (green checkmark)"
      - "ODIN CHECK: Customer address associated to new port in Associated Locations"
      - "TICKET UPDATE: Document original port (PP=XXX) and new port (PP=XXX)"
      - "TICKET UPDATE: Include ONT Distinguished Name in notes"
      - "TICKET UPDATE: Record service order number"
      - "TICKET UPDATE: Note any alternate scenarios encountered (suspended/pending/working)"
      - "MONITOR: Track order through provisioning for 24 to 48 hours"
    escalate_if: "Any verification step fails - keep ticket open until all checks pass"

  - id: "SOL-OPC-INVESTPEND"
    title: "Investigate Pending Port in ODiN"
    steps:
      - "On the Physical Device - Optical Node Terminal page scroll to the bottom"
      - "Under Associated From Resources click the blue MST Port link"
      - "On Hardware - Terminal Port page click the blue Network link near the top"
      - "On Network - Network page scroll to the bottom"
      - "Expand the Associated Reservations section"
      - "Look for entries showing PENDING status"
      - "Note the address shown in the Location column for the pending reservation"
      - "If the address matches your customer address - this is a duplicate order"
      - "If the address is different - investigate further before taking action"
      - "Document all reservation information before proceeding"
    escalate_if: "Cannot determine cause of pending port or address is unclear - escalate to supervisor before canceling"

  - id: "SOL-OPC-CANCELDUP"
    title: "Cancel Duplicate Order Causing Pending Port"
    steps:
      - "In Optius navigate to Structure Loading then Address then Address"
      - "Enter the address associated with the pending port reservation"
      - "Click Find"
      - "Select the address radio button in results"
      - "From dropdown select View Service Order Activity and click Go"
      - "Review the list of pending orders (CPDG status)"
      - "Click Open Details on each pending order to find which uses your target port"
      - "In order details expand CED Info and check the PP= value matches your target"
      - "Note the LCI and SO Number of the confirmed duplicate order"
      - "Click Back to return to the order activity list"
      - "Verify the checkmark is beside the correct duplicate order"
      - "Click Cancel Service Order and click OK to confirm"
      - "Refresh ODiN - target port should now show Available green checkmark"
      - "Proceed with ONT port change from step OPC-S013"
    escalate_if: "More than 2 pending orders or unclear which to cancel - escalate to supervisor before canceling anything"

  - id: "SOL-OPC-PENDINGESC"
    title: "Pending Port on Different Address - Escalation Required"
    steps:
      - "STOP - Do not cancel this order without supervisor guidance"
      - "Document the pending reservation details including address and order number"
      - "This port is legitimately in use by a different customer or order"
      - "Contact supervisor and explain the conflict"
      - "Provide the target port number, customer address, and conflicting order information"
      - "Wait for supervisor direction before taking any action"
    escalate_if: "Always - legitimate pending orders on different addresses require supervisor approval"

  - id: "SOL-OPC-DISCWORKING"
    title: "Disconnect Working Port - Signed Off in Error (Supervisor Approved)"
    steps:
      - "WARNING: Only proceed with documented supervisor approval on record"
      - "In ODiN on Physical Device - Optical Node Terminal scroll to the bottom"
      - "Under Associated From Resources click the blue MST Port link"
      - "Click the blue Network link at the top of Hardware - Terminal Port page"
      - "In Associated Reservations find the WORKING reservation and note the address"
      - "In Optius navigate to Structure Loading then Address and search the working address"
      - "Select address and choose View Address Facility List from dropdown then click Go"
      - "Click Find on the Address Facility List page"
      - "Select radio button beside Working facilities and click Open Details"
      - "In Facility Detail page expand CED Info and note the Circuit ID (DTN)"
      - "Open a second Optius window - do not close the first"
      - "In the second window create a disconnect order using the Circuit ID/DTN"
      - "Complete normal disconnect procedure - send work tickets and sign off"
      - "After disconnect return to first Optius window"
      - "Verify port now shows Available or Suspended in ODiN"
      - "If port shows a left-in address proceed to Remove Left-In Address solution"
      - "Then continue with port change from step OPC-S013"
    escalate_if: "Active customer service present without supervisor approval - STOP immediately and escalate"

  - id: "SOL-OPC-WORKINGESC"
    title: "Working Port - Supervisor Approval Required Before Proceeding"
    steps:
      - "STOP - Do not disconnect any working service without supervisor approval"
      - "Document the working port details - ONT name, PP number, customer address"
      - "Contact your supervisor and explain the situation clearly"
      - "Provide the target port PP number, why the port change is needed, and customer address"
      - "Wait for supervisor confirmation before taking any action"
      - "Document supervisor name and approval in your ticket notes"
    escalate_if: "Always - supervisor approval is mandatory before disconnecting any working service"

  - id: "SOL-OPC-UNSUSPEND"
    title: "Change Suspended Port to Available in ODiN"
    steps:
      - "In ODiN on Physical Device - Optical Node Terminal locate the Containment Structure"
      - "Right-click on the suspended port showing the pause symbol icon"
      - "Select View Resources from the context menu"
      - "On Hardware - Physical Port page locate the Status field"
      - "Click the Status dropdown"
      - "Change status from SUSPENDED to AVAILABLE"
      - "Click Save button at the bottom of the page"
      - "Click Back arrow to return to the ONT page"
      - "Verify port now shows green checkmark (Available) in Containment Structure"
      - "Now check Associated Locations - right-click port and View Resource"
      - "Verify Associated Locations shows no address - if it does see Remove Left-In solution"
      - "Port is now ready - proceed to step OPC-S014 for reassignment"
    escalate_if: "Port returns to Suspended after save or Save button fails - escalate to ODiN administrator"

  - id: "SOL-OPC-SUSPENDINFO"
    title: "Understanding Suspended Ports"
    steps:
      - "A suspended port was previously disabled - typically from an old disconnect order"
      - "Suspended ports are straightforward to fix - change status to Available in ODiN"
      - "Right-click the port with pause icon in Containment Structure"
      - "Select View Resources"
      - "Change Status dropdown from SUSPENDED to AVAILABLE"
      - "Click Save"
      - "After unsuspending always check Associated Locations to ensure port is clean"
      - "If an old address shows in Associated Locations it must be removed first"
      - "See Remove Left-In Address solution for that step"
    escalate_if: "Cannot change status due to permissions error - contact supervisor"

  - id: "SOL-OPC-REMOVELEFTIN"
    title: "Remove Left-In Address from ONT Port in ODiN"
    steps:
      - "A left-in address is from a previous service that was not properly cleaned up"
      - "On Hardware - Physical Port page in ODiN scroll to Associated Locations section"
      - "Click the arrow to expand the Associated Locations section"
      - "Identify the address that should NOT be associated to this port"
      - "In the Actions column click the Delete button for that address row"
      - "The address row disappears from the table (not saved yet)"
      - "Click Save button at the bottom of the page"
      - "Click Back arrow to return to the ONT page"
      - "Right-click the port again and select View Resource to confirm"
      - "Associated Locations should now show No Locations are associated"
      - "Port is now clean - proceed to step OPC-S014"
    escalate_if: "Multiple conflicting addresses present or cannot determine which to remove - escalate to supervisor"

  # -----------------------------------------------------------
  # WORKFLOW 2 SOLUTIONS - ONT SIZE CHANGE
  # -----------------------------------------------------------

  - id: "SOL-OSC-VERIFYREASON"
    title: "Verify Reason for ONT Size Change"
    steps:
      - "Review the work order in QFSF for equipment details and technician notes"
      - "Contact the field technician to understand what happened in the field"
      - "Common valid reasons for ONT size change:"
      - "  REPLACED: Technician swapped defective ONT with different model"
      - "  INVENTORY ERROR: Original ONT was entered incorrectly in ODiN"
      - "  UPGRADE: Customer service package requires a larger ONT"
      - "  FIELD MISMATCH: ODiN spec does not match physical ONT in field"
      - "Document the confirmed reason before making any changes in ODiN"
      - "If ONT was physically replaced get the new model number from technician"
      - "If inventory error confirm correct model by checking physical ONT label"
    escalate_if: "Cannot determine reason after checking all sources - escalate to supervisor before making changes"

  - id: "SOL-OSC-FINDDN"
    title: "Find ONT Distinguished Name"
    steps:
      - "METHOD 1 - From Optius service order:"
      - "  Open order in Optius via Service Order then Service Order Inquiry/Update"
      - "  Scroll to bottom of order and expand CED Info section"
      - "  ONT Distinguished Name format: ME=<address> ONT <number>"
      - "  Example: ME=1858 CHARLESTON LN ONT 1"
      - "METHOD 2 - From ODiN address search:"
      - "  In ODiN search for the customer address"
      - "  Expand the facility path under the address in Address Full Path view"
      - "  Locate the ME= entry that identifies the ONT"
      - "  Copy the complete Distinguished Name string"
      - "METHOD 3 - From field technician:"
      - "  Ask technician for the ONT serial number or model"
      - "  In ODiN search by serial number in Entity Attributes section"
      - "Document the full Distinguished Name before proceeding"
    escalate_if: "ONT cannot be located through any method - escalate to facilities team"

  - id: "SOL-OSC-SEARCHODIN"
    title: "Search for ONT in ODiN"
    steps:
      - "In ODiN paste the ONT Distinguished Name into the search bar at the top"
      - "Click the magnifying glass icon to execute the search"
      - "Expected result: Physical Device - Optical Node Terminal page opens"
      - "If search returns no results try searching by Common Name instead"
      - "Common Name format: <address> ONT <number> such as 1858 CHARLESTON LN ONT 1"
      - "Verify you are on the correct ONT by confirming address and ONT number match"
      - "If multiple results appear select the one matching your customer address"
    escalate_if: "ONT not found in ODiN after all search methods attempted - escalate to facilities team"

  - id: "SOL-OSC-WORKINGWARN"
    title: "ONT Has Working Ports - Proceed With Caution"
    steps:
      - "WARNING: This ONT has active customer services on working ports"
      - "Changing the ONT specification can impact active services if done incorrectly"
      - "Before proceeding document all working port assignments and customer information"
      - "Contact supervisor to confirm this change is authorized"
      - "SCENARIO A - ONT was physically replaced in the field:"
      - "  All customers on old ONT are already impacted by the physical swap"
      - "  Proceed with spec change to match the new physical ONT"
      - "  Port reassignments may be needed after spec change"
      - "SCENARIO B - Inventory correction only (no physical change):"
      - "  Spec change should not impact active working services"
      - "  Proceed carefully and verify no service disruption after change"
      - "Document all working port details before making any ODiN changes"
    escalate_if: "Any uncertainty about impact on working ports - always escalate to supervisor first"

  - id: "SOL-OSC-FINDSPEC"
    title: "Find Correct ONT Specification for New Model"
    steps:
      - "METHOD 1 - Check physical ONT label in the field:"
      - "  Ask technician to provide the exact model number from the ONT label"
      - "  Model numbers vary by vendor: Calix, Nokia, Adtran, etc."
      - "METHOD 2 - Check the QFSF work order:"
      - "  Open work order in Salesforce and review equipment section"
      - "  Equipment details should list the ONT model number"
      - "METHOD 3 - Check ODiN specification library:"
      - "  In ODiN navigate to Specifications search"
      - "  Search for ONT specifications matching the model"
      - "  Common spec formats: PRSPEC=ONT-2-2, PRSPEC=ONT-4-4, etc."
      - "  The numbers represent voice ports and data ports"
      - "  ONT-2-2 = 2 voice and 2 data ports"
      - "  ONT-4-4 = 4 voice and 4 data ports"
      - "Document the exact specification string before attempting the update"
    escalate_if: "Cannot confirm correct spec from any source - do not guess, escalate to supervisor"

  - id: "SOL-OSC-NAVSPEC"
    title: "Navigate to ONT Specification Field in ODiN"
    steps:
      - "On Physical Device - Optical Node Terminal page in ODiN"
      - "Locate the Specification field near the top of the page"
      - "The current spec will show as a blue link - example: PRSPEC=ONT-2-2"
      - "Click the current specification link to open the edit/change option"
      - "This opens the specification selection interface"
      - "You will search for and select the correct new specification here"
      - "Proceed to the Update ONT Specification solution for the next steps"
    escalate_if: "Specification field not visible or not editable - may need elevated ODiN permissions"

  - id: "SOL-OSC-UPDATESPEC"
    title: "Update ONT Specification in ODiN"
    steps:
      - "On Physical Device - Optical Node Terminal page locate the Specification field"
      - "Click the current spec link to open specification selection"
      - "In the specification search field enter the new ONT spec identifier"
      - "Example: search for ONT-4 to find 4-port ONT specifications"
      - "Review the results and select the specification matching the new ONT model"
      - "Confirm selection and click Save to apply the change"
      - "Verify the Specification field on the ONT page now shows the new spec"
      - "Check that the Containment Structure on the right side updated accordingly"
      - "Port count in Containment Structure should now match the new ONT spec"
    escalate_if: "Desired specification not available in ODiN library - escalate to Engineering to add spec"

  - id: "SOL-OSC-SPECERR"
    title: "Troubleshoot ONT Specification Update Error"
    steps:
      - "Note the exact error code and message text for reference"
      - "Common error causes:"
      - "  ACTIVE PORTS ERROR: Working ports may be preventing the spec change"
      - "  PERMISSION ERROR: Your account may not have spec change rights"
      - "  COMPATIBILITY ERROR: New spec may be incompatible with current network assignment"
      - "If error mentions active ports - review the Working Ports Warning solution"
      - "If it is a permissions error - contact supervisor to request elevated ODiN access"
      - "Try refreshing the ODiN page and attempting the update again"
      - "Screenshot the error message for supervisor or escalation reference"
    escalate_if: "Error persists after retry or is permission-related - escalate to supervisor with screenshot"

  - id: "SOL-OSC-VERIFYPORTS"
    title: "Verify Port Count in ODiN Containment Structure"
    steps:
      - "On Physical Device - Optical Node Terminal page in ODiN"
      - "Look at the Containment Structure section on the right side of the page"
      - "Click the expand arrows to see all slots and physical ports"
      - "SL=001 entries are voice ports"
      - "SL=002 entries are data ports"
      - "Count the PP= entries listed under each slot"
      - "Compare your count to the new ONT model specification:"
      - "  ONT-2-2 should have 2 voice ports under SL=001 and 2 data ports under SL=002"
      - "  ONT-4-4 should have 4 voice ports under SL=001 and 4 data ports under SL=002"
      - "If counts match the new spec - the specification change was successful"
      - "If counts do not match - see Fix Port Count Mismatch solution"
    escalate_if: "Cannot determine port structure or complex mismatch exists - escalate to ODiN administrator"

  - id: "SOL-OSC-PORTMISMATCH"
    title: "Fix Port Count Mismatch After ONT Spec Change"
    steps:
      - "Port count mismatch means the Containment Structure does not match the new spec"
      - "This requires manual adjustment of port records in ODiN"
      - "IF PORTS NEED TO BE ADDED:"
      - "  On the ONT page right-click in the Containment Structure"
      - "  Select Add Resource option"
      - "  Add the missing Physical Port entries with correct slot assignments"
      - "  SL=001 for voice ports and SL=002 for data ports"
      - "  Number ports sequentially: PP=001, PP=002, etc."
      - "IF PORTS NEED TO BE REMOVED:"
      - "  First verify port has no active assignment or working service"
      - "  Right-click the excess port in Containment Structure"
      - "  Select Remove or Delete Resource"
      - "  Confirm the deletion"
      - "After all adjustments verify total port count matches new ONT spec exactly"
    escalate_if: "Complex port structure changes required or working ports involved - escalate to ODiN admin"

  - id: "SOL-OSC-UPDATEORDER"
    title: "Update Pending Service Order to Reflect New ONT"
    steps:
      - "After completing ODiN spec update return to Optius"
      - "Open the pending service order via Service Order then Service Order Inquiry/Update"
      - "Scroll to bottom and expand CED Info to verify current ONT assignment"
      - "Verify the ONT shown still correctly matches the physical ONT in the field"
      - "If port assignments changed due to the spec change:"
      - "  Use Re-assign ODiN Facilities to update the port assignment"
      - "  Follow the full ONT Port Change workflow if a port change is now required"
      - "If only the spec changed and ports are the same:"
      - "  Click Save on the order to refresh the facility data"
      - "  Look for success message 1218 - Service Order has been updated"
      - "Verify QFSF work order shows updated and correct ONT information"
    escalate_if: "Order cannot be updated or generates errors - escalate to supervisor"

  - id: "SOL-OSC-COMPLETE"
    title: "ONT Size Change Complete - Final Verification Checklist"
    steps:
      - "ODIN CHECK: Specification field shows correct new ONT spec"
      - "ODIN CHECK: Containment Structure port count matches new spec exactly"
      - "ODIN CHECK: All existing port assignments are correct and consistent"
      - "OPTIUS CHECK: Service order reflects correct ONT if applicable"
      - "QFSF CHECK: Work order shows updated equipment information"
      - "TICKET UPDATE: Document old ONT spec (e.g., ONT-2-2)"
      - "TICKET UPDATE: Document new ONT spec (e.g., ONT-4-4)"
      - "TICKET UPDATE: Include ONT Distinguished Name"
      - "TICKET UPDATE: Document reason for change"
      - "TICKET UPDATE: Include technician name and CUID if field-initiated"
      - "If static build: Confirm Engineering case was created for NDS database update"
    escalate_if: "Any verification check fails - do not close ticket until all steps confirmed"

  # -----------------------------------------------------------
  # WORKFLOW 3 SOLUTIONS - SPLITTER LEG CHANGE
  # -----------------------------------------------------------

  - id: "SOL-SLC-FDT"
    title: "Use Field Data Tool (FDT) to Change Splitter Leg"
    steps:
      - "FDT is always the preferred method - use this whenever it is applicable"
      - "Open the Field Data Tool Kit document from the NAO Library"
      - "Navigate to the splitter leg change section in the document"
      - "Follow FDT steps to perform the automated leg change"
      - "FDT handles all system updates across Optius and ODiN automatically"
      - "Verify change completed successfully in FDT confirmation screen"
      - "Confirm with technician that they can proceed with installation on new leg"
    reference_doc: "Quantum Fiber - Field Data Tool Kit (QF Tech Assist)"
    escalate_if: "FDT fails or is unavailable - proceed with manual workflow from step SLC-S002"

  - id: "SOL-SLC-CHECKTECH"
    title: "How to Determine Technology Type (Static vs Dynamic)"
    steps:
      - "In ODiN search for the splitter associated with the customer address"
      - "On the Network - Network page for the splitter locate Associated Roles section"
      - "Look for the NRR (Network Resource Role) entry in that section"
      - "Click the NRR link to view the role details"
      - "STATIC BUILD indicators - Engineering case REQUIRED:"
      - "  NRR=XGS indicates XGS-PON technology"
      - "  G.hn or G.Fast in network description"
      - "  Distributed Split architecture"
      - "  Bulk Instant Internet deployment"
      - "DYNAMIC BUILD indicators - No Engineering case needed:"
      - "  NRR=GPON indicates standard GPON technology"
      - "  Standard residential flexible deployment"
      - "When in doubt always check with supervisor before proceeding"
    reference_doc: "Quantum Fiber - Identifying Static VS Dynamic (QF Tech Assist)"
    escalate_if: "Cannot determine build type from ODiN - always escalate rather than guess"

  - id: "SOL-SLC-ENGCASE"
    title: "Create Engineering Case for Static Build Splitter Leg Change"
    steps:
      - "STEP 1 - Create initial Tech Assist case in Salesforce:"
      - "  Click New Case in Salesforce"
      - "  Case Type: Tech Assist"
      - "  Subtype: Facility Issue - Inventory/Field Mismatch"
      - "  Add customer address and account information"
      - "STEP 2 - Reassign case to Engineering queue:"
      - "  Open the Tech Assist case just created"
      - "  Click Reassign Case button"
      - "  Case Type: Engineering Records Correction"
      - "  Subtype: Fiber Cable Terminal"
      - "  Click Reassign Case to submit to Engineering"
      - "STEP 3 - Add all required case notes:"
      - "  Old Splitter and Port (example: Splitter 001 / Port 015)"
      - "  New Splitter and Port (example: Splitter 002 / Port 008)"
      - "  Assigned distribution strand information"
      - "  Reason for the change"
      - "  Example note: Per Tech John Smith (JSMITH123) changed Splitter/Port"
      - "  from 001/015 to 002/008 - original leg defective bad splice at FDH"
      - "  Your Agent CUID making the change"
      - "Document the Engineering case number in your ticket"
      - "Do not wait for Engineering to complete - continue with facility changes now"
    escalate_if: "Cannot create Engineering case or access Salesforce - contact supervisor immediately"

  - id: "SOL-SLC-CAPTUREFAC"
    title: "Capture Current Facility Information from ODiN Before Changes"
    steps:
      - "In ODiN search for the customer address"
      - "On Address Full Path view check for ORSV=XXXXXX indicating a reservation"
      - "Click + in front of the ESP address entry to expand the facility tree"
      - "CAPTURE TERMINAL PORT: Note the terminal port tied to the address"
      - "CAPTURE FDH NAME:"
      - "  Find the ME= entry for the Physical Port in the distribution list"
      - "  FDH name is the text following ME= before the first slash"
      - "  Example: ME=WNPKFLXA WNPKFLJ0101 - FDH is WNPKFLXA WNPKFLJ0101"
      - "CAPTURE PHYSICAL PORT: Note the PP=XXX value such as PP=087"
      - "CAPTURE SPLITTER LEG:"
      - "  Click + in front of the Distribution Network to expand"
      - "  Note the current Leg number and the complete Distinguished Name string"
      - "  You will need this full DN to suspend the leg if it is defective"
      - "Write down all captured information before making any system changes"
    escalate_if: "Cannot read facility data from ODiN - may be a system issue, escalate to supervisor"

  - id: "SOL-SLC-CANCELPEND"
    title: "Cancel Pending Order to Release Splitter Leg"
    steps:
      - "Confirm all current facility information is already captured and documented"
      - "In Optius navigate to Service Order then Service Order Inquiry/Update"
      - "Search for the pending order by SO Number or customer address"
      - "Open the order and verify it is the correct pending order before canceling"
      - "Follow the Quantum Fiber - Cancelling Order in Optius (QF Tech Assist) procedure"
      - "After cancellation refresh ODiN to verify facilities released"
      - "ODiN refresh tip: click any link on the page then use the back arrow to return"
      - "Click + in front of ESP address then + in front of Distribution Network"
      - "Verify leg associations are now released and ORSV is gone"
      - "If leg is still associated after cancel - proceed to Disassociate PP from Leg solution"
      - "If original leg was defective - proceed to Suspend Splitter Leg solution"
      - "Then associate PP to the new correct leg"
    reference_doc: "Quantum Fiber - Cancelling Order in Optius (QF Tech Assist)"
    escalate_if: "Order cancel fails or order cannot be found - escalate to supervisor"

  - id: "SOL-SLC-CIDIS"
    title: "Write CIDIS Disconnect Order for Working Service"
    steps:
      - "Confirm reason with technician and document it: defective leg or physically wrong leg"
      - "In Optius write a CIDIS (Customer Initiated Disconnect) order for this service"
      - "Use the customer account and circuit information to identify the service"
      - "Process the disconnect order following standard CIDIS procedure"
      - "After CIDIS order completes refresh ODiN"
      - "ODiN refresh tip: click any link then use back arrow to return to prior screen"
      - "Click + in front of ESP address then + in front of Distribution Network"
      - "Check if leg associations still exist and need to be broken manually"
      - "If leg still associated proceed to Disassociate PP from Leg solution"
      - "If original leg is defective proceed to Suspend Splitter Leg solution"
      - "Then associate PP to new correct leg and recreate the order"
    escalate_if: "Cannot write CIDIS or situation is complex - escalate to supervisor"

  - id: "SOL-SLC-VERIFYTECH"
    title: "Verify Splitter Leg Issue with Field Technician"
    steps:
      - "Contact the field technician before making any system changes"
      - "Key questions to ask the technician:"
      - "  What is the exact problem with the current leg?"
      - "  Is the leg physically damaged, has a bad splice, or has signal loss?"
      - "  Was the PP physically connected to the wrong leg at the FDH?"
      - "  What leg number is the fiber actually connected to in the field?"
      - "  Is this area a static or dynamic fiber build?"
      - "Based on technician answers determine your path:"
      - "  DEFECTIVE LEG: Suspend old leg, associate PP to a new working leg"
      - "  WRONG LEG IN FIELD: Update ODiN to reflect what is actually connected"
      - "  STATIC BUILD: Create Engineering case before any system changes"
      - "Document technician full name and CUID for case notes and Engineering case"
    escalate_if: "Cannot reach technician after multiple attempts - escalate to supervisor"

  - id: "SOL-SLC-REMOVEFSAN"
    title: "Remove FSAN Serial Number from Network Management System"
    steps:
      - "CRITICAL: This step MUST be completed before disassociating any facilities"
      - "Skipping this step causes a conflicting ONT registration error that is difficult to resolve"
      - "Access the appropriate Network Management System for your technology type:"
      - "  XGS-PON technology: Access Calix CMS or your designated management system"
      - "  GPON technology: Access the appropriate vendor management system"
      - "Locate the currently assigned RONTA (Remote ONT Adapter) for this customer"
      - "Find the ONT by FSAN serial number or by customer address"
      - "Remove or clear the FSAN serial number from the RONTA assignment"
      - "Confirm FSAN is no longer registered to the old network element"
      - "Document that FSAN removal was completed before proceeding"
      - "Note: Technician will re-register the ONT using self-help tools after the leg change"
    escalate_if: "Cannot access NMS or FSAN removal fails - escalate to provisioning team immediately"

  - id: "SOL-SLC-DISASSOC"
    title: "Disassociate Physical Port from Splitter Leg in ODiN"
    steps:
      - "In ODiN expand the Distribution Network for the customer address"
      - "If a + sign appears in front of the Distribution Network the leg is still associated"
      - "Click on the Splitter Leg link to open the leg record"
      - "On Hardware - Leg page scroll to the Associated to Resources section"
      - "Locate the Physical Port (PP) row in the resources table"
      - "Click the Delete button in the Actions column for the Physical Port entry"
      - "The PP row disappears from the table - changes are not saved yet"
      - "Click Save button at the bottom left of the screen"
      - "Verify no error messages appear after saving"
      - "Click back arrow to return to the previous page"
      - "Refresh ODiN and verify the + sign is gone from Distribution Network"
      - "Physical Port is now free and ready to be associated to the new leg"
    escalate_if: "Delete button not available or Save fails - escalate to ODiN administrator"

  - id: "SOL-SLC-SUSPENDLEG"
    title: "Suspend Defective Splitter Leg in ODiN"
    steps:
      - "In ODiN search bar at the top paste the Splitter Leg Distinguished Name captured earlier"
      - "Click the magnifying glass icon to search"
      - "On Hardware - Leg page click the blue Network link near the top of the page"
      - "On Network - Network page locate the Status dropdown field"
      - "Click the Status dropdown and select SUSPENDED from the list"
      - "REQUIRED: Fill out the Description field with ALL of the following information:"
      - "  Date in MM/DD/YYYY format"
      - "  Reason for suspension - be specific"
      - "  Technician full name and CUID"
      - "  Your Agent CUID"
      - "  Example: 6/20/2025 - Suspending leg per Tech John Smith (JSMITH123)"
      - "  defective bad splice at FDH panel - Agent DRUDRUD"
      - "Click Save button at the bottom left of the screen"
      - "Verify Status field now shows SUSPENDED and description is saved"
      - "This leg will not be auto-assigned to new orders until changed back to Available"
    escalate_if: "Cannot suspend leg or description information is incomplete - do not suspend without proper documentation"

  - id: "SOL-SLC-ASSOCPP"
    title: "Associate Physical Port to New Splitter Leg in ODiN"
    steps:
      - "In ODiN search bar enter the FDH Distinguished Name captured earlier"
      - "Click magnifying glass to open Physical Device - Fibre Distribution Hub page"
      - "In Containment Structure on the right side navigate to the target Splitter Leg"
      - "Right-click on the target Splitter Leg"
      - "Select View Resource from the context menu"
      - "On Hardware - Leg page check the Associated to Resources section:"
      - "  If section is blank - proceed to add the Physical Port"
      - "  If section is populated - click Delete to remove existing PP then Save and go back and reopen"
      - "Click Add button under Associated to Resources"
      - "In the Associated Resources popup window:"
      - "  Set Entity Type dropdown to Physical Port"
      - "  Paste the PP Distinguished Name in the Distinguished Name field"
      - "  Example: ME=WNPKFLXA WNPKFLJ0101/RK=001/DF=001/SL=001/NC=001/PP=087"
      - "  Click Find button"
      - "  Check the box next to the correct Physical Port in results"
      - "  Confirm Status shows AVAILABLE before selecting"
      - "  Click OK button"
      - "Back on Hardware - Leg page click Save button at the bottom left"
      - "Verify PP now appears in Associated to Resources table"
      - "Technician can now register the ONT using self-help registration tools"
    escalate_if: "PP not found in search or shows non-Available status - check PP status in ODiN before proceeding"

  - id: "SOL-SLC-RECREATE"
    title: "Recreate Order After Splitter Leg Change"
    steps:
      - "METHOD 1 - Use ROP Button in QFSF (Preferred method):"
      - "  Open the customer account in QFSF Salesforce"
      - "  Click the ROP (Re-Order Process) button"
      - "  System automatically creates a new order in Optius"
      - "  Verify new order was created with the correct facilities"
      - "METHOD 2 - Manually create order in Optius:"
      - "  Navigate to Optius and create a new service order"
      - "  Enter the customer information accurately"
      - "  System will auto-assign available facilities from ODiN"
      - "  IMPORTANT: Verify the new leg was assigned and not the suspended old leg"
      - "AFTER ORDER CREATION - verify the following:"
      - "  Check CED Info in Optius to confirm new splitter leg is shown"
      - "  Send order to Switchgate if applicable for this build type"
      - "  Verify no Switchgate errors"
      - "  Open QFSF work order and confirm new splitter leg number is shown"
      - "  If static build confirm Engineering case was created"
    escalate_if: "ROP fails and manual creation has issues - escalate to supervisor"

  - id: "SOL-SLC-VERIFYQFSF"
    title: "Verify New Facilities on Work Order in QFSF"
    steps:
      - "Open the customer Work Order in QFSF Salesforce"
      - "Navigate to the facility and equipment information section"
      - "Verify ALL of the following fields show the NEW updated information:"
      - "  FDH name - should be the same FDH"
      - "  Splitter number - should be the new splitter"
      - "  Leg number - MUST be the new leg not the old suspended leg"
      - "  Physical Port PP number - should be the same PP"
      - "  ONT information - should be unchanged"
      - "If facilities show as CORRECT - work order is ready for the technician"
      - "If facilities show as INCORRECT:"
      - "  Use ODF (Order Data Fulfillment) tool to force a sync"
      - "  Enter the work order number in ODF"
      - "  Force update from Optius to Salesforce"
      - "  Wait 2 to 3 minutes and recheck the work order"
    escalate_if: "ODF sync does not update work order after 3 attempts - escalate to provisioning team"

  - id: "SOL-SLC-COMPLETE"
    title: "Splitter Leg Change Complete - Final Verification Checklist"
    steps:
      - "ODIN CHECK: PP is associated to the NEW leg in Associated to Resources"
      - "ODIN CHECK: Old leg shows SUSPENDED status with full documentation in Description"
      - "ODIN CHECK: FSAN serial number was removed from old network element in NMS"
      - "OPTIUS CHECK: Original order was canceled or CIDIS disconnect completed"
      - "OPTIUS CHECK: New order created successfully with correct facilities"
      - "OPTIUS CHECK: New order shows correct new splitter leg in CED Info"
      - "OPTIUS CHECK: Order sent to Switchgate and no errors if applicable"
      - "QFSF CHECK: Work Order shows the new splitter leg number"
      - "QFSF CHECK: All facility fields on work order are updated correctly"
      - "QFSF CHECK: Technician has correct information to complete field work"
      - "STATIC BUILD CHECK: Engineering case created and documented with case number"
      - "TICKET UPDATE: Document old splitter and leg such as Splitter 001 Leg 015"
      - "TICKET UPDATE: Document new splitter and leg such as Splitter 002 Leg 008"
      - "TICKET UPDATE: Document reason for change"
      - "TICKET UPDATE: Include technician name and CUID"
      - "TICKET UPDATE: Engineering case number if static build"
      - "TECHNICIAN NEXT STEPS: Connect fiber to new splitter leg at FDH"
      - "TECHNICIAN NEXT STEPS: Register ONT using self-help tools"
      - "TECHNICIAN NEXT STEPS: Verify service activates successfully"
    escalate_if: "Any verification step fails - do not release to field technician until all checks pass"