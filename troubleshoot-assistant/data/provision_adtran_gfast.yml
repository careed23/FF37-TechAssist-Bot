---
- name: Provision Adtran G.Fast Service
  hosts: adtran_mosaic_devices
  gather_facts: no
  vars:
    subscriber_id: "{{ lookup('env', 'SUBSCRIBER_ID') }}"
    mosaic_username: "{{ lookup('env', 'MOSAIC_USERNAME') }}"
    mosaic_password: "{{ lookup('env', 'MOSAIC_PASSWORD') }}"
    mosaic_url: "{{ lookup('env', 'MOSAIC_URL') }}"
    vlan_id: "{{ lookup('env', 'VLAN_ID') }}"
    speed_profile: "{{ lookup('env', 'SPEED_PROFILE') }}"

  tasks:
    - name: Log in to Adtran MOSAIC
      ansible.builtin.shell:
        cmd: "ssh {{ mosaic_username }}@{{ mosaic_url }} 'your_login_command_here'"
      register: mosaic_login_result
      ignore_errors: yes

    - name: Create G.Fast Service
      ansible.builtin.shell:
        cmd: "mosaic-cli -u {{ mosaic_username }} -p {{ mosaic_password }} 'create service {{ subscriber_id }} vlan {{ vlan_id }} speed {{ speed_profile }}'"
      when: mosaic_login_result.rc == 0

    - name: Verify G.Fast Service Creation
      ansible.builtin.shell:
        cmd: "mosaic-cli -u {{ mosaic_username }} -p {{ mosaic_password }} 'show service {{ subscriber_id }}'"
      register: service_verification
      when: mosaic_login_result.rc == 0

    - name: Display Service Verification
      ansible.builtin.debug:
        var: service_verification.stdout_lines
      when: mosaic_login_result.rc == 0
